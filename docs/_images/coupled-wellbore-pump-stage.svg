<text x="321.0" y="950.3" font-size="11.5" fill="#52606d" text-anchor="middle" font-weight="normal" font-style="italic">no</text>
<path d="M305.0,1036.0 L305.0,1062.0" fill="none" stroke="#616e7c" stroke-width="1.5" marker-end="url(#arrow-616e7c)"/>
