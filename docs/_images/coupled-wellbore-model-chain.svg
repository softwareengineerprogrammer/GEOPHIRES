<text x="230.0" y="420.5" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">solve schedule along P<tspan baseline-shift="sub" font-size="72%">res</tspan>(t), T<tspan baseline-shift="sub" font-size="72%">res</tspan>(t) · failure checks</text>
