<text x="230.0" y="352.9" font-size="13" fill="#123e7c" text-anchor="middle" font-weight="bold">CoupledWellBores (Production Wellbore Model 2)</text>
<text x="230.0" y="369.8" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Productivity Index → transmissivity k·b</text>
<text x="230.0" y="386.7" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">reservoir volume per well → drainage radius r<tspan baseline-shift="sub" font-size="72%">e</tspan></text>
