<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Coupled inflow-wellbore model in the GEOPHIRES calculation chain</title>
<desc id="desc">GEOPHIRES modules run top to bottom; the coupled wellbore model sends one request per production history to superhot-wellbore and receives a production profile with the wellhead state at every time step.</desc>
